info:
  name: /user update force
  type: http
  seq: 4

http:
  method: PUT
  url: "{{demoUrl}}/ws/user"
  headers:
    - name: x-device-identifier
      value: "{{deviceIdentifier}}"
    - name: x-correlation-id
      value: "{{correlationId}}"
  body:
    type: json
    data: |-
      [
        {
          "uid":"{{userId}}",
          "firstName": "John",
          "lastName": "Smith",
          "email": "john.smith5@inugami.io"
        }
      ]
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const responseBody = res.getBody();
        bru.setEnvVar('userId',responseBody[0].uid);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
