info:
  name: /user create
  type: http
  seq: 1

http:
  method: POST
  url: "{{demoUrl}}/ws/user"
  headers:
    - name: x-device-identifier
      value: "{{deviceIdentifier}}"
    - name: x-correlation-id
      value: "{{correlationId}}"
  body:
    type: json
    data: |-
      [
        {
          "firstName": "john",
          "lastName": "smith",
          "email": "john.smith5@inugami.io"
        }
      ]
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const responseBody = res.getBody();
        bru.setEnvVar('userId',responseBody[0].uid);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

