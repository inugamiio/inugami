info:
  name: actuator/health
  type: http
  seq: 1

http:
  method: GET
  url: "{{demoUrl}}/actuator/health"
  headers:
    - name: Authorization
      value: "{{tokenBeebole}}"
    - name: Content-Type
      value: application/json
    - name: x-device-identifier
      value: "{{deviceIdentifier}}"
  body:
    type: json
    data: ""

runtime:
  scripts:
    - type: before-request
      code: |-
        const { utils } = require('./commons_utils');
        bru.setEnvVar('demoUrl', 'http://localhost:8080');
        bru.setEnvVar('deviceIdentifier', utils.buildUid());
    - type: after-response
      code: |-
        const contentType = res.getHeader('x-correlation-id');
        bru.setEnvVar('correlationId', contentType);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

